<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud Browser Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    .cloud-container {
      width: 240px;
      height: 320px;
      margin: 0 auto;
      background-color: #121212;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 2px solid #333;
    }
    .cloud-header {
      height: 40px;
      background-color: #1f1f1f;
      border-bottom: 1px solid #333;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .url-form {
      width: 100%;
      display: flex;
    }
    .cloud-input {
      width: 100%;
      height: 32px;
      background-color: #2a2a2a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 0 8px;
      font-size: 13px;
      outline: none;
    }
    .cloud-input:focus {
      border-color: #00539f;
      background-color: #333;
    }
    .cloud-viewport {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: auto;
      background-color: #fff;
    }
    .cloud-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .cloud-footer {
      height: 25px;
      background-color: #1f1f1f;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      color: #bbb;
    }
    .lsk { font-weight: bold; color: #00539f; }
    .rsk { font-weight: bold; color: #d9534f; }
  </style>
</head>
<body>

  <div class="cloud-container">
    <!-- 40px Header & Input -->
    <header class="cloud-header">
      <form id="urlForm" class="url-form" onsubmit="handleFormSubmit(event)">
        <input 
          type="text" 
          id="urlInput" 
          class="cloud-input" 
          placeholder="Search or Enter URL..." 
          autocomplete="off" 
          inputmode="search"
        />
      </form>
    </header>

    <!-- Main Viewport -->
    <main id="cloudViewport" class="cloud-viewport">
      <iframe id="browserFrame" src="https://google.com" class="cloud-iframe" title="Browser View"></iframe>
    </main>

    <!-- Footer Soft Keys -->
    <footer class="cloud-footer">
      <span class="lsk">Go (OK)</span>
      <span class="rsk">Back</span>
    </footer>
  </div>

  <script>
    const inputField = document.getElementById('urlInput');
    const viewport = document.getElementById('cloudViewport');
    const browserFrame = document.getElementById('browserFrame');
    let isInputFocused = false;

    // Focus state listeners
    inputField.addEventListener('focus', () => { isInputFocused = true; });
    inputField.addEventListener('blur', () => { isInputFocused = false; });

    function handleFormSubmit(e) {
      e.preventDefault();
      let url = inputField.value.trim();
      if (url) {
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        browserFrame.src = url;
        inputField.blur();
      }
    }

    // Keypad Navigation Controller
    window.addEventListener('keydown', (e) => {
      const key = e.key;

      // Right Soft Key (RSK) -> Back
      if (key === 'SoftRight' || key === 'F2' || e.keyCode === 113) {
        e.preventDefault();
        window.history.back();
        return;
      }

      // If textbox is active, do not let directional keys scroll page
      if (isInputFocused || document.activeElement === inputField) {
        if (key === 'Enter' || key === 'Select' || e.keyCode === 13) {
          handleFormSubmit(e);
        }
        return;
      }

      // Keypad scrolling (2, 4, 8, 6)
      const step = 60;
      switch (key) {
        case '2':
        case 'ArrowUp':
          viewport.scrollTop -= step;
          break;
        case '8':
        case 'ArrowDown':
          viewport.scrollTop += step;
          break;
        case '4':
        case 'ArrowLeft':
          viewport.scrollLeft -= step;
          break;
        case '6':
        case 'ArrowRight':
          viewport.scrollLeft += step;
          break;
        case '1':
          inputField.focus();
          break;
      }
    });
  </script>
</body>
</html>
