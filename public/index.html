<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Phone Browser</title>
  <style>
    /* Feature Phone Optimized Layout */
    body { margin: 0; padding: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
    #bar { display: flex; background: #222; padding: 5px; align-items: center; }
    
    /* Input Field that Triggers Proton Jet Native Text Dialog */
    #urlInput {
      flex: 1;
      padding: 8px;
      font-size: 16px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="bar">
    <!-- tabindex and inputmode force Proton Jet 4G to open system keypad dialog -->
    <input 
      type="text" 
      id="urlInput" 
      placeholder="Enter URL or Search..." 
      tabindex="1"
      inputmode="text"
    />
  </div>

  <div id="viewport" style="position:relative; width:100vw; height:calc(100vh - 45px); overflow:hidden;">
    <img id="screen" style="width:100%; height:100%; object-fit:contain;" />
  </div>

  <script>
    const urlInput = document.getElementById('urlInput');

    // 1. Trigger Native System Keyboard Dialog on Click/Focus
    function triggerSystemInput() {
      // Proton Jet / KaiOS browsers open the native Text Prompt via standard prompt or direct focus
      const userInput = prompt("Enter URL or Search:", urlInput.value || "");
      if (userInput !== null && userInput.trim() !== "") {
        urlInput.value = userInput;
        if (typeof navigate === 'function') {
          navigate(userInput);
        }
      }
    }

    if (urlInput) {
      urlInput.addEventListener('click', triggerSystemInput);
    }

    // 2. Physical Keypad Listener for 2, 4, 8, 6 Scrolling & Soft Keys
    document.addEventListener('keydown', (e) => {
      const key = e.key || e.keyCode;

      // Top Left Key / OK Key on top URL Bar -> Opens System Text Dialog
      if (key === 'Enter' || key === 'SoftLeft' || key === 'F1' || key === 'Select' || key === 13) {
        if (document.activeElement === urlInput || (typeof cursorY !== 'undefined' && cursorY <= 30)) {
          triggerSystemInput();
          e.preventDefault();
        } else {
          if (typeof executeClick === 'function') executeClick();
        }
      } 
      // Numeric Keypad Scroll (When typing dialog is closed)
      else if (key === '2' || key === '50') {
        if (typeof scrollPage === 'function') scrollPage('up');
      } else if (key === '8' || key === '56') {
        if (typeof scrollPage === 'function') scrollPage('down');
      } else if (key === '4' || key === '52') {
        if (typeof scrollPage === 'function') scrollPage('left');
      } else if (key === '6' || key === '54') {
        if (typeof scrollPage === 'function') scrollPage('right');
      }
    });
  </script>
</body>
</html>
